name: Refresh public data

on:
  workflow_dispatch:
  schedule:
    - cron: "26 */2 * * *"

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes --requirement requirements.txt
      - name: Verify public export boundary
        run: python -m unittest
      - name: Export published rows
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python export.py
      - name: Build deterministic source snapshot
        run: |
          rm -f staticevolution/*
          sqlite-diffable dump staticevolution.db staticevolution --all
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-data
          path: staticevolution
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: export
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rm -f staticevolution/*
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: public-data
          path: staticevolution
      - name: Commit changed public data
        run: |
          git config user.name "Static Evolution backup"
          git config user.email "actions@users.noreply.github.com"
          git add staticevolution
          git diff --cached --quiet && exit 0
          git commit -m "Refresh public data"
          git push
